name = "budget-bot"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "budget"
database_id = "fa9ee9d8-8e37-42c6-8ef5-d7dd21aa9c05"

[triggers]
# кожні 5 хв звіряємо виписку mono; о 19:00 UTC (21:00 Київ взимку) вечірній підсумок
crons = ["*/5 * * * *", "0 19 * * *"]

[observability]
enabled = true
